# main config for srs.
# See /usr/share/doc/srs/conf for further examples

listen              1935;
max_connections     1000;

srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
#    dir             ./objs/nginx/html;
}

srt_server {j
    enabled on;
    listen 10080;
    connect_timeout 4000;
    peerlatency 60; # RTT * 3
    recvlatency 60; # RTT * 3
    latency 60; # RTT * 3
    tlpktdrop on;
    tsbpdmode on;
}

rtc_server {
    enabled on;
    listen 8000; # UDP port
    # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#config-candidate
    candidate $CANDIDATE;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
    }
    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }
    rtc {
        enabled     on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc off;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp off;
    }

    play{
        gop_cache_max_frames 2500;
    }
}

vhost __defaultVhost__ {
    tcp_nodelay on;
    min_latency on;

    hls {
        enabled on;
    }

    srt {
        enabled     on;
        srt_to_rtmp on;
    }

    rtc {
        enabled     on;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtmp-to-rtc
        rtmp_to_rtc off;
        # @see https://ossrs.net/lts/zh-cn/docs/v4/doc/webrtc#rtc-to-rtmp
        rtc_to_rtmp off;
    }

    play {
        gop_cache off;
        queue_length 10;
        mw_latency 100;
    }

    publish {
        mr off;
    }

    http_remux {
        enabled on;
        mount [vhost]/[app]/[stream].flv;
        hstrs on;
    }
}